<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>deskpet</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="pet" width="280" height="340" data-tauri-drag-region></canvas>

      <!-- speech bubble -->
      <div id="bubble" class="hidden"></div>

      <!-- hover menu -->
      <div id="menu" class="hidden">
        <button class="mbtn" data-act="food" title="Feed">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 6c-1-2-4-2.5-5.5-1S3 9 4.5 12 9 17 10 17s4-2 5.5-5 .5-5.5-1-7-4.5-1-4.5 1"/><path d="M10 6c0-2 1.2-3.2 3-3.4"/></svg>
        </button>
        <button class="mbtn" data-act="water" title="Water">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3s5 5.5 5 9a5 5 0 01-10 0c0-3.5 5-9 5-9z"/></svg>
        </button>
        <button class="mbtn" data-act="pet" title="Pet">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 11V5.5a1.3 1.3 0 012.6 0M8.6 10V4.3a1.3 1.3 0 012.6 0M11.2 10V5a1.3 1.3 0 012.6 0v6.5c0 3-2 5.5-5 5.5-2 0-3.2-1-4.2-2.5L3 12c-.5-1 .8-2.2 1.8-1.2L6 12"/></svg>
        </button>
        <button class="mbtn" data-act="focus" title="Focus timer">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="11" r="6.5"/><path d="M10 7.5V11l2.5 1.5"/><path d="M7.5 2.5h5M10 2.5v2"/></svg>
        </button>
        <button class="mbtn" data-act="edit" title="Edit">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.5 1.5M13.5 13.5L15 15M15 5l-1.5 1.5M6.5 13.5L5 15"/></svg>
        </button>
      </div>

      <!-- edit panel -->
      <div id="edit" class="hidden">
        <div class="row"><span>body</span><input type="color" id="bodyc" /></div>
        <div class="row"><span>hair</span><input type="color" id="hairc" /></div>
        <div class="row"><span>size</span><span class="stepper"><button id="sizeDown">–</button><button id="sizeUp">+</button></span></div>
        <div class="row"><span>theme</span><span class="seg" id="themeSeg"><button data-theme="os">OS</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></span></div>
        <div class="row"><span>chatter</span><button id="chatterBtn">on</button></div>
        <div class="row"><span>quiet mode</span><button id="dndBtn">off</button></div>
        <div class="row"><span>roam</span><span class="seg" id="roamSeg"><button data-roam="dock">Dock</button><button data-roam="free">Free</button></span></div>
        <button id="editDone">done</button>
      </div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
