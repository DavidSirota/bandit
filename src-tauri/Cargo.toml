[package]
name = "deskpet"
version = "0.1.0"
description = "A private, offline desktop creature that reacts to your activity."
edition = "2021"
rust-version = "1.77"

# Minimal dependency surface on purpose: tauri core + serde only.
# No http, no networking crates, nothing that can reach off-machine.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS-only: one objc2 call to let the creature float over fullscreen apps
# (fullScreenAuxiliary collection behavior). objc2 is already in Tauri's tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
